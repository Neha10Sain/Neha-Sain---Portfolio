<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching studio blue backdrop -->
    <radialGradient id="bgGlow" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#6b8eb9"/>
      <stop offset="50%" stop-color="#4c6a8f"/>
      <stop offset="100%" stop-color="#2d425c"/>
    </radialGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261b18"/>
      <stop offset="35%" stop-color="#191110"/>
      <stop offset="70%" stop-color="#2d201c"/>
      <stop offset="100%" stop-color="#120c0a"/>
    </linearGradient>

    <!-- Skin Tone Gradients -->
    <radialGradient id="faceGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f8c9a5"/>
      <stop offset="60%" stop-color="#eeb086"/>
      <stop offset="100%" stop-color="#d69368"/>
    </radialGradient>
    <linearGradient id="neckGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c88359"/>
      <stop offset="100%" stop-color="#df9d74"/>
    </linearGradient>

    <!-- Blazer Charcoal Fabric Texture / Gradient -->
    <linearGradient id="blazerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3c4046"/>
      <stop offset="50%" stop-color="#2b2e34"/>
      <stop offset="100%" stop-color="#1e2126"/>
    </linearGradient>
    <linearGradient id="lapelGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#4a4f56"/>
      <stop offset="100%" stop-color="#24272c"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0e1726" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="500" rx="32" fill="url(#bgGlow)"/>
  
  <!-- Ambient Studio Vignette -->
  <circle cx="250" cy="220" r="220" fill="#ffffff" opacity="0.06"/>

  <g id="portraitGroup" filter="url(#softShadow)">
    <!-- Back Hair Volume -->
    <path d="M 170 120 C 130 160 100 240 105 380 C 108 430 120 480 135 500 L 365 500 C 380 480 392 430 395 380 C 400 240 370 160 330 120 Z" fill="url(#hairGrad)"/>

    <!-- Shoulders & Upper Body / Suit -->
    <!-- White Top Neckline -->
    <path d="M 215 350 Q 250 375 285 350 L 305 450 L 195 450 Z" fill="#ffffff"/>
    <path d="M 220 355 Q 250 370 280 355" stroke="#e2e8f0" stroke-width="2" fill="none"/>

    <!-- Charcoal Suit Jacket -->
    <!-- Left Shoulder & Body -->
    <path d="M 130 500 L 140 410 C 150 370 180 350 215 345 L 250 450 L 195 500 Z" fill="url(#blazerGrad)"/>
    <!-- Right Shoulder & Body -->
    <path d="M 370 500 L 360 410 C 350 370 320 350 285 345 L 250 450 L 305 500 Z" fill="url(#blazerGrad)"/>

    <!-- Lapels -->
    <path d="M 215 345 L 240 435 L 205 440 L 180 365 Z" fill="url(#lapelGrad)"/>
    <path d="M 285 345 L 260 435 L 295 440 L 320 365 Z" fill="url(#lapelGrad)"/>

    <!-- Neck & Throat -->
    <path d="M 218 290 L 218 355 Q 250 375 282 355 L 282 290 Z" fill="url(#neckGrad)"/>
    <!-- Shadow under chin -->
    <ellipse cx="250" cy="295" rx="35" ry="12" fill="#9e5a32" opacity="0.3"/>

    <!-- Head & Face Structure -->
    <path d="M 180 200 C 180 140 210 115 250 115 C 290 115 320 140 320 200 C 320 255 292 305 250 305 C 208 305 180 255 180 200 Z" fill="url(#faceGrad)"/>

    <!-- Facial Features -->
    <!-- Eyebrows -->
    <path d="M 205 185 Q 220 178 235 184" stroke="#231714" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 265 184 Q 280 178 295 185" stroke="#231714" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- Eyes (Warm Almond) -->
    <!-- Left Eye -->
    <path d="M 205 198 Q 220 190 234 198 Q 220 206 205 198 Z" fill="#ffffff"/>
    <circle cx="220" cy="198" r="5.5" fill="#2d1d18"/>
    <circle cx="221" cy="196.5" r="2" fill="#ffffff"/>
    <path d="M 204 197 Q 219 189 235 197" stroke="#2d1d18" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Right Eye -->
    <path d="M 266 198 Q 280 190 295 198 Q 280 206 266 198 Z" fill="#ffffff"/>
    <circle cx="280" cy="198" r="5.5" fill="#2d1d18"/>
    <circle cx="281" cy="196.5" r="2" fill="#ffffff"/>
    <path d="M 265 197 Q 281 189 296 197" stroke="#2d1d18" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Nose -->
    <path d="M 248 200 L 246 235 Q 250 240 254 235" stroke="#c0784d" stroke-width="2" fill="none" stroke-linecap="round"/>
    <ellipse cx="243" cy="237" rx="2.5" ry="1.5" fill="#b06c42"/>
    <ellipse cx="257" cy="237" rx="2.5" ry="1.5" fill="#b06c42"/>

    <!-- Gentle Confident Smile -->
    <path d="M 232 262 Q 250 274 268 262" stroke="#bd5f5e" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 234 262 Q 250 268 266 262" stroke="#943b3a" stroke-width="1.5" fill="none"/>

    <!-- Soft Cheeks Blush -->
    <circle cx="210" cy="235" r="16" fill="#e27c6b" opacity="0.18"/>
    <circle cx="290" cy="235" r="16" fill="#e27c6b" opacity="0.18"/>

    <!-- Front Flowing Hair (Middle Parting) -->
    <!-- Left Hair Strands -->
    <path d="M 250 115 C 230 115 185 140 175 190 C 165 240 160 330 170 420 C 175 450 185 480 190 500 L 160 500 C 145 450 145 350 150 250 C 155 180 190 125 245 116 Z" fill="url(#hairGrad)"/>
    <!-- Right Hair Strands -->
    <path d="M 250 115 C 270 115 315 140 325 190 C 335 240 340 330 330 420 C 325 450 315 480 310 500 L 340 500 C 355 450 355 350 350 250 C 345 180 310 125 255 116 Z" fill="url(#hairGrad)"/>
    
    <!-- Hair Sheen & Highlights -->
    <path d="M 195 160 C 185 200 178 260 182 320" stroke="#4a332d" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 305 160 C 315 200 322 260 318 320" stroke="#4a332d" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>
</svg>
